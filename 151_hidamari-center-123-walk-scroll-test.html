<div id="status">151 中央①→②→③　タップ歩行＋カメラ追従</div>
<script>
const game=document.getElementById('game');
const camera=document.getElementById('camera');
const hero=document.getElementById('hero');

const WORLD_W=1536, WORLD_H=686;
let p={x:180,y:520}, goal={...p}, moving=false, prev=0;
let camX=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function cameraRange(){return Math.max(0,WORLD_W-innerWidth);}

function updateCamera(){
  // 主人公を画面中央付近へ追従。左右端では自然に止める。
  const wanted=p.x-innerWidth*0.48;
  camX=clamp(wanted,0,cameraRange());
  camera.style.left=(-camX)+'px';
}

function setGoal(clientX,clientY){
  const r=game.getBoundingClientRect();
  const worldX=clamp(clientX-r.left+camX,35,WORLD_W-35);
  // マップが画面中央配置なので、画面Y→ワールドYへ変換
  const mapTop=(innerHeight-WORLD_H)/2;
  const worldY=clamp(clientY-mapTop,95,WORLD_H-25);
  goal={x:worldX,y:worldY};
  moving=true;
}

game.addEventListener('touchstart',e=>{
  if(!e.touches || !e.touches[0]) return;
  const t=e.touches[0];
  setGoal(t.clientX,t.clientY);
  e.preventDefault();
},{passive:false});

game.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch') return;
  setGoal(e.clientX,e.clientY);
  e.preventDefault();
},{passive:false});

function loop(t){
  if(!prev) prev=t;
  const dt=Math.min(35,t-prev); prev=t;
  if(moving){
    const dx=goal.x-p.x, dy=goal.y-p.y;
    const d=Math.hypot(dx,dy);
    if(d<2){
      p={...goal}; moving=false;
    }else{
      const step=Math.min(d,0.30*dt);
      p.x+=dx/d*step;
      p.y+=dy/d*step;
    }
  }
  hero.style.left=p.x+'px';
  hero.style.top=p.y+'px';
  updateCamera();
  requestAnimationFrame(loop);
}
addEventListener('resize',updateCamera);
requestAnimationFrame(loop);
</script>
</body>
